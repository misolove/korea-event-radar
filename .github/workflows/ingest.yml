name: Ingest Events

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0,6,12,18 * * *"

jobs:
  ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: korea-event-radar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: korea-event-radar/package-lock.json

      - run: npm ci

      - run: npm run test

      - run: npm run ingest
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          OPS_SECRET: ${{ secrets.OPS_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
